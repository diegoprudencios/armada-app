<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var key = 'armada-theme';
        var theme = 'light';
        try {
          var fromQuery = new URLSearchParams(window.location.search).get('theme');
          if (fromQuery === 'dark' || fromQuery === 'light') {
            theme = fromQuery;
            localStorage.setItem(key, theme);
          } else {
            var saved = localStorage.getItem(key);
            if (saved === 'dark' || saved === 'light') theme = saved;
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-light.ico" sizes="any" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-dark.ico" sizes="any" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Armada App — System docs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-systemdocs.tsx"></script>
  </body>
</html>
